apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: securethecloud
  labels:
    app: redis
spec:
  containers:
  - name: redis
    image: redis:7
    ports:
      - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: securethecloud
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
